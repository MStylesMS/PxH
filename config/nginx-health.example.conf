# Example nginx snippets for Paradox Health Monitor
# Merge into venue nginx site config (e.g. /etc/nginx/sites-available/paradox-html).
# Preferred operator URLs: /health/ (UI) and /health-api/ (API + WebSocket)
# Fallback when nginx is down: http://<host>:19090/ui/

location /health/ {
    alias /opt/paradox/apps/PxH/public/;
    index index.html;
}

location /health-api/ {
    proxy_pass http://127.0.0.1:19090/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 86400;
}
