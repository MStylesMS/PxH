# Example nginx snippets for Paradox Health Monitor
# Merge into venue nginx-paradox.conf / site config.

location /health/ {
    alias /opt/paradox/apps/PxH/public/;
    try_files $uri $uri/ /health/index.html;
}

location /health-api/ {
    proxy_pass http://127.0.0.1:19090/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}
