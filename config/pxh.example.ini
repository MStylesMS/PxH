; Paradox Health Monitor (PxH) — example config
; Install copy: /opt/paradox/config/pxh.ini

[server]
; Bind localhost; nginx proxies /health-api/
host = 127.0.0.1
port = 19090
; Serve public/ under /ui/ when true (handy for local dev)
serve_ui = true

[machine]
; Used in MQTT topic paradox/<id>/system/...
; Prefer explicit room slug; fall back to hostname if blank.
id =
; Optional display name for UI
hostname =

[mqtt]
enabled = false
broker = mqtt://127.0.0.1:1883
; Topic prefix without trailing slash; <id> appended as paradox/<id>/system/...
; If blank, uses paradox/<machine.id>
topic_base =
publish_interval_seconds = 30
username =
; password =

[thresholds]
disk_warn_percent = 85
disk_critical_percent = 95
; Optional free-space floors (GB); 0 = disabled
disk_warn_free_gb = 0
disk_critical_free_gb = 1

[runtime]
; Comma-separated systemd unit names reported by GET /runtime
services = mosquitto,pfx,pxo,pxb,pxt,pxc,pxfe,paradox-health

[actions]
; Allow POST /actions/* (disable on untrusted networks)
enabled = true
allow_upgrade = true
allow_reboot = true
allow_service = true
allow_cleanup = true
allow_prune_ide = true
