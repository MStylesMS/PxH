; Paradox Health Monitor (PxH) — example configuration
; Install copy: /opt/paradox/config/pxh.ini
; Docs: docs/SPEC.md · docs/API.md · docs/INSTALL.md · docs/QUICK-SETUP.md

[server]
; Bind for LAN/Tailscale viewing (metrics/UI are unauthenticated)
host = 0.0.0.0
port = 19090
; Also serve static UI at /ui/ (fallback when nginx is down)
serve_ui = true

[machine]
; MQTT id in {topic_root}/<id>/system/...
id =
hostname =

[thresholds]
disk_warn_percent = 85
disk_critical_percent = 95
disk_warn_free_gb = 0
disk_critical_free_gb = 1

[services]
; Comma-separated systemd unit names (omit apps not installed on this host)
required = mosquitto,nginx,pfx,pxo
optional = paradox-health,pxb,pxt,pxc,pfxe,pio
; Extra operator-defined units (same state model: running/stopped/failed)
user =

[mqtt]
enabled = true
; Often local; set to remote broker URL when needed
broker = mqtt://127.0.0.1:1883
; Publishes as {topic_root}/{machine.id}/system/{health,disk,services,alerts}
topic_root = paradox
; Optional full override (lab only). When set, replaces topic_root/id prefix.
; topic_base =
publish_interval_seconds = 30
username =
; password =

; ── System Warnings panel (MQTT subscribe) ─────────────────────────────
[warnings]
enabled = true
; History: keep last N lines OR H hours (whichever limit hits first)
history_lines = 200
history_hours = 24
; topic_pattern = color_key  (first match wins; more specific first)
rule.1.pattern = paradox/+/pfx/warnings
rule.1.color = pfx
rule.2.pattern = paradox/+/pfxe/warnings
rule.2.color = pfx
rule.3.pattern = paradox/+/pxo/warnings
rule.3.color = pxo
rule.4.pattern = paradox/+/pio/warnings
rule.4.color = pio
rule.5.pattern = paradox/+/pxb/warnings
rule.5.color = pxb
rule.6.pattern = paradox/+/pxb/+/warnings
rule.6.color = pxb
rule.7.pattern = paradox/+/pxt/warnings
rule.7.color = pxt
; Game / room catch-all (e.g. paradox/agent22/+/warnings)
rule.8.pattern = paradox/+/+/warnings
rule.8.color = game

; Semantic colors → CSS pairs for day (dark tone) / night (light tone)
[warnings.colors]
pfx = red
pxo = orange
pio = purple
pxb = teal
pxt = blue
game = amber
default = gray

[journal]
enabled = true
history_lines = 100
history_hours = 6
; Empty = follow units from [services]; or explicit list
units =
; Color by severity (fixed); not per-app
color_mode = severity

[props]
enabled = true
topics = paradox/props
history_lines = 50
history_hours = 168

[ui]
; day | night | auto (prefers-color-scheme) — page also has a toggle
theme = auto
refresh_seconds = 15

[actions]
enabled = true
allow_upgrade = true
allow_reboot = true
allow_service = true
allow_cleanup = true
allow_prune_ide = true
; Session cookie lifetime after PAM login (hours)
session_hours = 12
; Comma-separated local usernames allowed to run actions (empty = any PAM-valid user)
allowed_users =
; Secret for signing session cookies (auto-generated to state file if empty)
; session_secret =

[prune]
; weekly | low_disk | manual_only
; weekly and low_disk both auto-run at startup and on interval_hours
schedule = low_disk
interval_hours = 24
